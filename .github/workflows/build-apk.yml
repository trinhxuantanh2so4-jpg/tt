name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu da co san Android SDK (env ANDROID_HOME).
      # Chi can chap nhan license; AGP tu tai platform/build-tools con thieu.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Ghi loi build/test ra annotation de xem duoc ma khong can quyen xem log
      - name: Report build errors
        if: failure()
        run: |
          cat build.log test.log 2>/dev/null | grep -n -E "^e: |error:|Unresolved reference|FAILURE: Build|What went wrong|Could not resolve|Caused by|Execution failed|AAPT|Android resource|tests? (completed|failed)|There were failing tests|FAILED|Assertion|expected:|GeminiServiceTest" \
            | sed 's/\r//g' | cut -c1-900 | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          echo "---- deps ----"
          cat build.log test.log 2>/dev/null | grep -n -E "^\\* What went wrong|^> " | head -5 || true
        continue-on-error: true

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TT Downloader v1.0.0
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
